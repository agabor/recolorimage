name: Build WordPress Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint


      - name: Build WordPress plugin
        run: npm run build:plugin
 
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Transfer plugin to server via SCP
        run: |
          scp -i ~/.ssh/deploy_key.pem plugin-build/recolorimage.zip agabor@${{ secrets.SERVER_IP }}:/tmp/recolorimage.zip
        
      - name: Install plugin using WP CLI
        run: |
          ssh -i ~/.ssh/deploy_key.pem agabor@${{ secrets.SERVER_IP }} '
            wp plugin delete recolorimage --path=/var/www/recolorimage || true
            wp plugin install /tmp/recolorimage.zip --activate --path=/var/www/recolorimage
            rm /tmp/recolorimage.zip
          '

      - name: Purge Cloudflare Cache
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
               -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
               -H "Content-Type:application/json" \
               --data '{"purge_everything":true}'
