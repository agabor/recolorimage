name: Build WordPress Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint


      - name: Build WordPress plugin
        run: npm run build:plugin
 
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ./deploy_key.pem
          chmod 600 ./deploy_key.pem

      - name: Transfer plugin to server via SCP
        if: github.ref == 'refs/heads/main'
        run: |
          scp -o StrictHostKeyChecking=accept-new -i ./deploy_key.pem plugin-build/recolorimage.zip agabor@${{ secrets.SERVER_IP }}:/tmp/recolorimage.zip
        
      - name: Install plugin using WP CLI
        if: github.ref == 'refs/heads/main'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ./deploy_key.pem agabor@${{ secrets.SERVER_IP }} '
            wp plugin delete recolorimage --path=/var/www/recolorimage || true
            wp plugin install /tmp/recolorimage.zip --activate --path=/var/www/recolorimage
            rm /tmp/recolorimage.zip
          '
          
      - name: Transfer guide.xml to server via SCP
        if: github.ref == 'refs/heads/main'
        run: |
          scp -o StrictHostKeyChecking=accept-new -i ./deploy_key.pem guide.xml agabor@${{ secrets.SERVER_IP }}:/tmp/guide.xml
          
      - name: Import guide.xml to WordPress
        if: github.ref == 'refs/heads/main'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ./deploy_key.pem agabor@${{ secrets.SERVER_IP }} '
            wp import /tmp/guide.xml --authors=create --path=/var/www/recolorimage
            rm /tmp/guide.xml
          '
          
      - name: Clean up
        if: github.ref == 'refs/heads/main'
        run: |
          rm ./deploy_key.pem

      - name: Purge Cloudflare Cache
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
               -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
               -H "Content-Type:application/json" \
               --data '{"purge_everything":true}'
